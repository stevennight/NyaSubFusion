<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NyaSubFusion 界面 v2 原型</title>
<style>
:root {
  --bg: #141419; --bg2: #1b1b22; --panel: #20202a; --panel2: #272733; --line: #33333f; --line2: #41414f;
  --tx: #e9e9f0; --tx2: #a9a9b8; --tx3: #7a7a8a;
  --acc: #ff7aa8; --acc2: #b49cff; --ok: #5fd39a; --warn: #ffc35a; --bad: #ff6b6b;
  --c-sub: #7cc4ff; --c-ocr: #ffb35c; --c-asr: #9be38a; --c-fuse: #b49cff; --c-tr: #ff7aa8;
  --note: #ffe48a; --r: 8px;
  --ui: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  --ja: "Yu Gothic UI", "Yu Gothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); font: 13px/1.5 var(--ui) }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
.ja { font-family: var(--ja) }
.dim { color: var(--tx3) } .muted { color: var(--tx2) }
.sp { flex: 1 }
.row { display: flex; align-items: center; gap: 8px } .wrap { flex-wrap: wrap }
.col { display: flex; flex-direction: column; gap: 8px }

/* 原型工具条（不是界面的一部分） */
.proto { position: sticky; top: 0; z-index: 90; display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: #2a2340; border-bottom: 1px solid #4a3d73; font-size: 12px }
.proto b { color: var(--acc2); margin-right: 6px }
.proto button { border: 1px solid #4a3d73; background: transparent; border-radius: 5px; padding: 2px 8px; color: #cfc4ff }
.proto button.on { background: #4a3d73; color: #fff }
.note { display: none; border: 1px dashed #d8c060; background: #3a3420cc; color: var(--note); border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.55; margin: 6px 0 }
.note::before { content: "改动说明 · "; font-weight: 700 }
body.notes .note { display: block }

/* 外壳 */
.app { display: grid; grid-template-columns: 72px minmax(0, 1fr); grid-template-rows: 46px minmax(0, 1fr); height: calc(100vh - 31px); min-width: 1180px }
.top { grid-column: 1/3; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--bg2); border-bottom: 1px solid var(--line) }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px } .logo b { color: var(--acc) }
.crumb { display: flex; align-items: center; gap: 6px; margin-left: 14px; color: var(--tx2) }
.crumb a { color: var(--tx2); cursor: pointer; text-decoration: none } .crumb a:hover { color: var(--tx) }
.crumb strong { color: var(--tx) }
.nav { background: var(--bg2); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px }
.nav button { width: 60px; padding: 8px 0 6px; border: 0; border-radius: 8px; background: none; color: var(--tx3); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px }
.nav button:hover { color: var(--tx); background: var(--panel) }
.nav button.on { color: var(--acc); background: #ff7aa814 }
.nav svg { width: 20px; height: 20px }
.nav .badge-n { font-size: 10px; background: var(--acc); color: #2a0d18; border-radius: 99px; padding: 0 5px; margin-top: -2px }
.main { overflow: auto; min-height: 0 }
.page { padding: 18px 22px; max-width: 1480px; margin: 0 auto }

/* 通用部件 */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line2); font-size: 12px; color: var(--tx2); white-space: nowrap }
.chip.acc { color: var(--acc); border-color: #ff7aa855; background: #ff7aa814 }
.chip.ok { color: var(--ok); border-color: #5fd39a55; background: #5fd39a12 }
.chip.warn { color: var(--warn); border-color: #ffc35a55; background: #ffc35a12 }
.chip.bad { color: var(--bad); border-color: #ff6b6b55; background: #ff6b6b12 }
.chip.tpl { color: var(--acc2); border-color: #b49cff55; background: #b49cff14 }
.chip.click { cursor: pointer } .chip.click:hover { border-color: #6a6a7c }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line2); background: var(--panel2); white-space: nowrap }
.btn:hover:not(:disabled) { border-color: #5a5a6c; background: #2e2e3b }
.btn.pri { background: var(--acc); border-color: var(--acc); color: #2a0d18; font-weight: 600 }
.btn.tplb { border-color: #b49cff88; color: var(--acc2) }
.btn.sm { padding: 3px 8px; font-size: 12px } .btn.ghost { background: transparent }
.btn:disabled { opacity: .45; cursor: not-allowed }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px }
.card h3, h3 { margin: 0 0 10px; font-size: 13.5px; font-weight: 600 }
h2 { margin: 0; font-size: 18px }
.inp { width: 100%; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line2); background: var(--bg2); outline: none }
.inp:focus { border-color: var(--acc) }
select.inp { width: auto; min-width: 160px }
.kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px 12px; align-items: center }
.kv > .lbl { color: var(--tx2); text-align: right; font-size: 12.5px }
.kv > .lbl.mod::after { content: " ●"; color: var(--acc2); font-size: 10px }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden }
.seg button { border: 0; background: var(--bg2); padding: 4px 11px; color: var(--tx2) }
.seg button + button { border-left: 1px solid var(--line2) }
.seg button.on { background: #ff7aa822; color: var(--acc) }
.sw { width: 30px; height: 17px; border-radius: 99px; background: var(--line2); position: relative; border: 0; flex: none; padding: 0 }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: #ccc; transition: .15s }
.sw.on { background: var(--acc) } .sw.on::after { left: 15px; background: #fff }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px }
.tabs button { border: 0; background: none; padding: 9px 16px; color: var(--tx2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 13.5px }
.tabs button.on { color: var(--tx); border-bottom-color: var(--acc); font-weight: 600 }
.tabs button small { color: var(--tx3); margin-left: 4px }
table.tb { width: 100%; border-collapse: collapse }
.tb th { text-align: left; font-weight: 500; color: var(--tx3); font-size: 12px; padding: 5px 8px; border-bottom: 1px solid var(--line) }
.tb td { padding: 6px 8px; border-bottom: 1px solid #2a2a35 }
.tb tr.off td { opacity: .45 }
.adv { margin-top: 12px; border-top: 1px dashed var(--line2); padding-top: 10px }
.adv > summary { cursor: pointer; color: var(--tx2); font-size: 12.5px; margin-bottom: 10px }
.hint { font-size: 12px; color: var(--tx3) }
.link { color: var(--acc); cursor: pointer } .link:hover { text-decoration: underline }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none }
.dot.done { background: var(--ok) } .dot.stale { background: var(--warn) } .dot.fail { background: var(--bad) }
.dot.off { background: transparent; border: 1px solid var(--tx3) } .dot.run { background: var(--acc); box-shadow: 0 0 0 3px #ff7aa833 }
.dot.na { background: var(--line2) }
.badge { font-size: 11px; padding: 0 6px; border-radius: 4px; font-weight: 600 }
.b-c { background: #7cc4ff22; color: var(--c-sub) } .b-a { background: #9be38a22; color: var(--c-asr) } .b-o { background: #ffb35c22; color: var(--c-ocr) }
.b-f { background: #b49cff22; color: var(--c-fuse) } .b-t { background: #ff7aa822; color: var(--c-tr) }

/* 库 */
.lib-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px }
.drop { border: 1.5px dashed var(--line2); border-radius: 10px; padding: 14px; text-align: center; color: var(--tx2); margin-bottom: 16px }
.series-card { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin-bottom: 12px; overflow: hidden }
.series-card .sh { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--panel2); cursor: pointer }
.series-card .sh:hover { background: #2d2d3a }
.series-card .sh b { font-size: 14.5px }
.ep { display: grid; grid-template-columns: 22px minmax(0, 1.4fr) 1fr 1fr auto; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid #2a2a35; cursor: pointer }
.ep:hover { background: #24242f }

/* 一集：页头 + 运行条 */
.ephead { display: flex; align-items: center; gap: 10px; padding: 12px 22px 0; flex-wrap: wrap }
.runbar { display: flex; align-items: center; gap: 8px }
.runbar .pending { font-size: 12px; color: var(--warn); max-width: 420px; text-align: right; line-height: 1.35 }
.epbody { padding: 0 22px 22px }
.menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 50; width: 300px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 10px; box-shadow: 0 8px 30px #0008 }
.menu label { display: flex; gap: 6px; align-items: center; padding: 3px 0 }
.menu hr { border: 0; border-top: 1px solid var(--line2); margin: 8px 0 }

/* 处理：步骤列表 + 详情 */
.md { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start }
.steps { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; position: sticky; top: 0 }
.grp { font-size: 11px; color: var(--tx3); padding: 8px 8px 3px; letter-spacing: .05em }
.step { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 7px; cursor: pointer; position: relative }
.step:hover { background: var(--panel2) }
.step.sel { background: #ff7aa816; box-shadow: inset 2px 0 0 var(--acc) }
.step .nm { display: flex; flex-direction: column; min-width: 0 }
.step .nm b { font-weight: 500; font-size: 13px }
.step .nm small { color: var(--tx3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.step.offs .nm b { color: var(--tx3) }
.step .moddot { position: absolute; right: 44px; top: 9px; color: var(--acc2); font-size: 10px }
.step.lead { opacity: .7 }
.vline { margin-left: 14px; border-left: 1px solid var(--line2); padding-left: 0 }
.detail .dh { display: flex; align-items: center; gap: 10px; margin-bottom: 12px }
.detail .dh h2 { font-size: 17px }
.logbox { background: #101015; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 12px/1.6 Consolas, monospace; color: #b8b8c8; max-height: 160px; overflow: auto; white-space: pre-wrap }
.region { position: relative; aspect-ratio: 16/9; max-width: 420px; border-radius: 8px; overflow: hidden; background: linear-gradient(160deg, #2d4a5e, #1a2a33 60%, #3a3226) }
.region .r { position: absolute; border: 1.5px solid var(--c-ocr); background: #ffb35c18 }
.region .r.x { border-color: var(--bad); background: #ff6b6b22 }
.region .r span { position: absolute; left: 3px; top: 1px; font-size: 10.5px; color: #fff }

/* 输出 */
.out { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 14px; align-items: start }
.olist { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; position: sticky; top: 0 }
.oi { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; cursor: pointer }
.oi:hover { background: var(--panel2) }
.oi.sel { background: #ff7aa816; box-shadow: inset 2px 0 0 var(--acc) }
.oi .t { flex: 1; min-width: 0 } .oi .t small { display: block; color: var(--tx3); font-size: 11.5px }
.oi.na { opacity: .45 }
.oi .swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid #0006; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none }
.oadd { padding: 5px 8px; color: var(--tx3); cursor: pointer; font-size: 12.5px } .oadd:hover { color: var(--acc) }
.oed { display: grid; grid-template-columns: minmax(0, 1fr) 470px; gap: 14px; align-items: start }
.stack { display: flex; flex-direction: column; gap: 6px }
.lay { border: 1px solid var(--line2); border-radius: 8px; background: var(--bg2) }
.lay .lh { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer }
.lay .grip { color: var(--tx3); cursor: grab }
.lay.sel { border-color: var(--acc) }
.lay .lb { border-top: 1px solid var(--line); padding: 10px 12px }
.screen { aspect-ratio: 16/9; border-radius: 8px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 70% 30%, #4f6b7d, #22313a 55%, #151d22); }
.screen .sky { position: absolute; inset: 0; background: linear-gradient(transparent 55%, #0006) }
.screen .info { position: absolute; left: 4%; top: 6%; color: #ffe680; font-size: 15px; font-weight: 600; text-shadow: 0 0 3px #000, 0 0 3px #000 }
.screen .subs { position: absolute; left: 0; right: 0; bottom: 5%; text-align: center; display: flex; flex-direction: column; gap: 2px; align-items: center }
.screen .l1 { color: #fff; font-size: 22px; font-weight: 600; text-shadow: 0 0 3px #101010, 0 0 3px #101010, 0 0 3px #101010 }
.screen .l2 { color: #e8e8e8; font-size: 14px; text-shadow: 0 0 2px #101010, 0 0 2px #101010; font-family: var(--ja) }
.screen .l2 rt { font-size: 8px }
.screen .hl { outline: 1.5px dashed var(--acc); outline-offset: 2px; border-radius: 2px }
.timebar { display: flex; align-items: center; gap: 8px; margin-top: 8px }
.timebar .tl { flex: 1; height: 4px; background: var(--line2); border-radius: 2px; position: relative }
.timebar .tl i { position: absolute; left: 0; top: 0; bottom: 0; width: 38%; background: var(--acc); border-radius: 2px }
.usedby { display: flex; flex-direction: column; gap: 4px }
.usedby div { display: flex; gap: 8px; align-items: center; padding: 4px 8px; background: var(--bg2); border-radius: 6px }

/* 资料 */
.notes-grid { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 14px; align-items: start }
.scope { font-size: 11px; padding: 0 6px; border-radius: 4px }
.scope.s { background: #b49cff22; color: var(--acc2) } .scope.e { background: #ff7aa822; color: var(--acc) } .scope.g { background: #7cc4ff22; color: var(--c-sub) }

/* 模板模式：紫色 */
.tplmode .steps, .tplmode .olist, .tplmode .detail > .card, .tplmode .oed > .card { border-color: #b49cff66 }
.tplbanner { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: 8px; background: #b49cff14; border: 1px solid #b49cff55; color: #d6cbff; margin-bottom: 12px }

/* 对话框 */
.modal { position: fixed; inset: 0; background: #000a; display: grid; place-items: center; z-index: 80 }
.modal .card { width: 760px; max-height: 84vh; overflow: auto }

/* 说明页 */
.doc { max-width: 1060px; margin: 0 auto; padding: 22px; line-height: 1.75 }
.doc h1 { font-size: 22px; margin: 0 0 4px }
.doc h2 { font-size: 16px; margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line) }
.doc li { margin: 3px 0 } .doc b { color: #fff }
.doc table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12.5px }
.doc th, .doc td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top }
.doc th { background: var(--panel2); font-weight: 500; color: var(--tx2) }
.doc code { background: var(--panel2); padding: 0 4px; border-radius: 3px; font-size: 12px }
.ia { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0 }
.ia > div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12.5px }
.ia h4 { margin: 0 0 4px; font-size: 13px; color: var(--acc) }
</style>
</head>
<body class="notes">
<div class="proto">
  <b>原型 v2</b>
  <button data-go="doc">设计说明</button>
  <button data-go="library">库</button>
  <button data-go="series">作品页</button>
  <button data-go="ep:process">一集 · 处理</button>
  <button data-go="ep:output">一集 · 输出</button>
  <button data-go="ep:notes">一集 · 资料</button>
  <button data-go="settings">设置</button>
  <span class="sp"></span>
  <label class="row" style="color:#cfc4ff"><input type="checkbox" id="shownotes" checked> 显示改动说明（黄色虚线框）</label>
</div>
<div class="app">
  <header class="top">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 32 32"><path d="M5 8 L9 3 L13 9 Q16 8 19 9 L23 3 L27 8 Q29 13 28 19 Q26 28 16 28 Q6 28 4 19 Q3 13 5 8Z" fill="#ff7aa8"/><circle cx="11.5" cy="16" r="2" fill="#2a0d18"/><circle cx="20.5" cy="16" r="2" fill="#2a0d18"/><path d="M14 21 Q16 23 18 21" stroke="#2a0d18" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="7" y="23.5" width="18" height="2.2" rx="1.1" fill="#fff" opacity=".85"/></svg>
      <span>Nya<b>Sub</b>Fusion</span>
    </div>
    <div class="crumb" id="crumb"></div>
    <div class="sp"></div>
    <span class="chip acc" id="jobchip" style="cursor:pointer" data-go="queue">● 任务：1 个运行中</span>
  </header>
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>
</div>
<div id="modal"></div>

<script>
// ---------------- 假数据 ----------------
const SERIES = [
  { name: "海辺の暮らし", tpl: true, terms: 86, readings: 14, eps: [
    { name: "第1集", st: "done", note: "已输出 3 个字幕文件 · MKV" },
    { name: "第2集", st: "review", note: "待审校 12 条" },
    { name: "第3集", st: "stale", note: "改了设置：4 步待运行", cur: true },
    { name: "第4集", st: "run", note: "语音识别 42%" },
  ]},
  { name: "ゆるキャン△ S3", tpl: true, terms: 41, readings: 3, eps: [
    { name: "#01", st: "done", note: "已输出 2 个字幕文件" },
    { name: "#02", st: "none", note: "还没运行" },
  ]},
];
const LOOSE = [
  { name: "NHKスペシャル 深海の巨大生物", st: "done", note: "已输出 1 个字幕文件" },
  { name: "ラジオ深夜便 2026-10-12", st: "none", note: "还没运行" },
];
const ST_LBL = { done: ["完成", "ok"], review: ["待审校", "warn"], stale: ["待运行", "warn"], run: ["运行中", "acc"], none: ["未运行", ""] };

// 处理：步骤（竖排的步骤图；点一步右边就是它的设置和日志）
const STEPS = [
  { g: "开始" },
  { id: "basic", name: "语言与作品", sum: "日语 → 简体中文 · 海辺の暮らし", st: "none" },
  { g: "来源", sub: "识别出原文" },
  { id: "subs", name: "读取字幕", badge: ["字幕", "b-c"], sum: "内封 ARIB 字幕 · 412 条", st: "done", t: "4s", on: true },
  { id: "asr", name: "语音识别", badge: ["语音", "b-a"], sum: "本机 · large-v3 · 人声分离自动", st: "done", t: "3m12s", on: true },
  { id: "ocr", name: "画面字识别", badge: ["画面字", "b-o"], sum: "4 帧/秒 · 2 个区域", st: "stale", t: "", on: true, mod: true },
  { id: "ocr_refine", name: "画面字复核", sum: "关 · 用视觉大模型逐处确认", st: "off", on: false },
  { g: "合成", sub: "合成一份字幕" },
  { id: "align", name: "字幕对时", sum: "按语音校准字幕时间", st: "done", t: "6s" },
  { id: "fuse", name: "合并来源", sum: "三路结果合成一份", st: "stale" },
  { id: "translate", name: "整理与翻译", badge: ["大模型", "b-t"], sum: "deepseek · 附画面截图", st: "stale", mod: true },
  { g: "输出", sub: "设置在「输出」页" },
  { id: "annotate", name: "注音", sum: "2 个图层有注音", st: "stale", jump: true },
  { id: "render", name: "生成字幕文件", sum: "3 个文件", st: "stale", jump: true },
  { id: "video", name: "生成视频", sum: "运行完自动封装 MKV", st: "stale", jump: true },
];
const STEP_ST = { done: ["可复用", "ok", "done"], stale: ["要重做", "warn", "stale"], off: ["关", "", "off"], none: ["", "", "na"], fail: ["失败", "bad", "fail"] };

// 输出：字幕文件 / 视频 / 样式
// 出厂样式：软件自带、只读，随时可以从这里加回来或恢复
const FACTORY = {
  main: { label: "正文", font: "Microsoft YaHei", size: 60, color: "#FFFFFF", outline: "#101010", ow: 3 },
  sub: { label: "小字", font: "Yu Gothic", size: 38, color: "#E8E8E8", outline: "#101010", ow: 2.4 },
  info: { label: "说明", font: "Microsoft YaHei", size: 42, color: "#FFE680", outline: "#101010", ow: 2.4 },

// ---------------- 设计说明 ----------------
function doc() {
  return h`<div class="doc">
  <h1>界面 v2：问题和调整方案</h1>
  <div class="dim">原型只是界面结构，不涉及内核；点上面紫色工具条切换页面。黄色虚线框写的是每处改了什么、为什么。</div>

  <h2>一、现在的问题</h2>
  <ol>
    <li><b>导航把三类东西摆在同一层。</b>应用级（项目、队列、设置）、一集的工作（流程、审校）、一集的配置（图层样式、术语）并排；没打开项目时一半是灰的。</li>
    <li><b>同一件事分在好几处。</b>
      <ul>
        <li>输出：哪些字幕文件要输出——「图层样式」的“导出时启用”和「流程 › 输出视频」表的“输出文件”是<b>同一个开关</b>；导出 / 封装 / 压制按钮两页各一套；“广播字幕原样”只在流程页；“去掉的符号”对所有方案生效，却放在单个方案里。</li>
        <li>所属作品、节目说明：「流程」和「术语」各一个输入框，保存方式不同（术语页的作品还是自由输入，别处是下拉）。</li>
        <li>作品默认设置：「流程」「图层样式」各有一个“正在编辑：这一集 / 作品”切换——同一张表单轮流改两份文件；图层页切到作品后还是自动保存，直接写进作品。</li>
      </ul></li>
    <li><b>「流程」页什么都有，又是平铺。</b>运行按钮、做到、重做、步骤图、日志、四张配置卡片、作品覆盖按钮、融合统计都在一页，上下滚着找。步骤图和配置是两套东西：看到“画面字识别”要重做，得往下翻找它的设置；“画面字复核”在图上是独立一步，在配置里却是画面字下面的一个选项。</li>
    <li><b>「图层样式」三层概念挤在一列。</b>方案（就是一个输出文件）→ 图层 → 样式。方案用下拉框选；样式没有自己的地方，只能在某个图层下面改（改了影响所有用它的图层），新建要在浏览器弹窗里输英文名，不能改名、删除，看不到谁在用。</li>
    <li><b>保存方式不一致。</b>流程、术语、设置要点“保存”，图层样式 0.5 秒自动保存（叫“已应用”）；运行前必须先保存，运行按钮灰着写“先保存配置”。</li>
    <li><b>用词不统一。</b>方案 / 输出方案 / 输出文件 / 导出时启用；步骤“融合 + 翻译”和“规则融合”；“VLM 复核”和“视觉复核”；“做到”；“已应用 / 待应用”和“已保存 / 未保存”；“运行完自动 不输出 / 封装 / 压制”和表格里的封装列、压制列是两套开关。</li>
    <li><b>作品不是一等公民。</b>没有地方看“这部作品有几集、默认设置是什么、共享了哪些术语”，作品只在向导、流程、术语、队列的选择框里出现。</li>
  </ol>

  <h2>二、新的结构</h2>
  <div class="ia">
    <div><h4>左栏：只放应用级</h4>库 · 任务 · 设置。不会再有灰按钮。</div>
    <div><h4>库 → 作品 → 一集</h4>库按作品分组列出各集；作品页有 各集 / 默认设置 / 节目说明与术语；打开一集后用页内标签：处理 · 审校 · 输出 · 资料。顶部面包屑。</div>
    <div><h4>运行条常驻一集的页头</h4>▶ 运行，旁边写“下次运行会重做：…”。运行到、强制重做、不用缓存、清掉修改收进 ▾。</div>
    <div><h4>处理 = 步骤列表 + 详情</h4>原来的步骤图竖排成左栏，同时就是设置的导航。点一步，右边是它的设置、状态、上次日志。来源类步骤的开关就在列表上。</div>
    <div><h4>输出 = 清单 + 编辑 + 预览</h4>左边三组：字幕文件（每个一个“输出”开关，包括广播字幕原样）、视频（封装 MKV、压制硬字幕）、样式（有自己的清单）。右边编辑，最右实时预览。</div>
    <div><h4>资料</h4>节目说明、本集概要、术语表、读音词典。每条标范围：本集 / 作品 / 全局。</div>
  </div>
  <ul>
    <li><b>作品默认设置只在作品页改</b>（整页变紫）。一集的页头只显示“和作品默认设置不同 N 项”，点开逐项选“用作品的 / 存到作品”；设置项旁边直接标出作品的值。</li>
    <li><b>所有设置自动保存</b>（Ctrl+Z 撤销），和图层页现在的做法一样；运行条告诉你哪些步骤会因此重做。运行开始时读好配置，运行中改的下次生效（现在就是这样）。</li>
    <li>设置页的“用途”补上“云端语音识别”，和翻译、画面字复核放在一起。</li>
  </ul>

  <h2>三、旧位置 → 新位置</h2>

    <tr><td>图层样式 › 图层下面的“样式「x」”</td><td>输出 › 样式 › 某个样式</td></tr>

  <h2>四、用词</h2>
  <table><thead><tr><th>现在</th><th>统一成</th><th>说明</th></tr></thead><tbody>
    <tr><td>方案、输出方案、profile</td><td>字幕文件</td><td>一个方案就是输出的一个文件；配置文件里的 <code>render.profiles</code> 不用改</td></tr>
    <tr><td>导出时启用、输出文件（列）</td><td>输出（开关）</td><td>只在一个地方出现</td></tr>
    <tr><td>流程</td><td>处理</td><td>“流程”听起来像只看不改</td></tr>

  <h2>五、默认设置：每一集只有一个模板</h2>
  <p>现在“默认”有四种来源，规则还不一样：</p>
  <table><thead><tr><th>来源</th><th>存在哪</th><th>对已有的集</th></tr></thead><tbody>
    <tr><td>内置默认</td><td>程序里</td><td>一直生效（程序更新改了默认值，旧项目跟着变）</td></tr>
    <tr><td>全局配置</td><td>全局 config.toml</td><td><b>一直生效</b>：改了会让旧项目下次运行时重做；识别、输出参数在界面上还看不到、改不了</td></tr>
    <tr><td>内容预设</td><td>写死在 presets.py</td><td>建项目时复制，只复制预设里写了的几项，其余仍走全局 / 内置</td></tr>
    <tr><td>作品默认设置</td><td>series.toml</td><td>建这一集时整份复制，之后各自独立</td></tr>
  </tbody></table>
  <p>所以“恢复默认”说不清恢复成什么，界面也没法告诉你一个值是从哪来的。改成：</p>
  <ul>
    <li><b>模板</b> = 这一集建出来时用的那一份：属于作品的是作品默认设置，不属于作品的是建项目时选的预设（project.toml 里已经记着 <code>project.preset</code>）。</li>
    <li><b>预设和作品默认设置是同一种东西。</b>设置里加「预设」：内置预设只读，可以“复制成我的”；自己的预设能新建、编辑、删除，能指定“新项目默认用它”。任何一集都能“存成预设”。新建作品时选一个预设当它的默认设置。</li>
    <li><b>全局配置只留和这台电脑有关的</b>（接口、用途、显卡、下载镜像）。现在写在全局配置里的识别、输出参数迁移成一个“我的默认”预设，以后只在新建时复制，不再实时生效。内置默认仍然实时生效（只随程序升级变），更新说明里列出改了哪些默认值。</li>
    <li><b>恢复默认 = 恢复成模板</b>，三档：单项（值旁边“模板：3”和 ↺）、一步（步骤右上角“这一步恢复成模板”）、整份（页头“和模板不同 N 项”）。都先备份。</li>
    <li><b>改了模板可以选择同步给已有的集。</b>只同步这次改的项；自己单独改过那一项的集默认不勾。默认还是不同步。</li>
    <li>每次运行前留一份设置快照，可以“回到上次运行时的设置”（自动保存以后，Ctrl+Z 只管这次打开期间）。</li>
  </ul>

  <h2>六、样式管理</h2>
  <p>现在的情况（对着内核查过）：</p>
  <ul>
    <li><b>内置的 5 个样式删不掉</b>：读配置时先放进内置的 main、sub、orig_main、info、translit，再按名字把项目写的盖上去（config.py <code>_merge_styles</code>），删了下次又回来。自己新建的删得掉，但界面没有按钮。</li>
    <li><b>有的样式是暗中在用的</b>：说明文字用每个字幕文件的 <code>info_style</code>（默认 info，界面改不了）；图层引用的样式不存在时退回 main；原文合并字幕用 orig_main。只数图层会算漏。</li>
    <li>样式名就是引用的钥匙，不能改名；新建要在浏览器弹窗里输英文名。</li>
    <li>阴影配置里有、界面没有；底色框、字间距配置里也没有。</li>
  </ul>
  <p>改成：</p>
  <ul>
    <li><b>出厂样式</b>：软件自带一套，只读，改不了删不掉（就是现在代码里的 DEFAULT_STYLES）。每个预设、每一集的样式都是从这里复制出去的一整套，可以随便改、改名、删。每个样式记着它来自哪个出厂样式（新加一个 <code>base</code> 字段）。</li>
    <li><b>两种恢复</b>：“恢复成模板里的样子”（作品 / 预设里你调过的）和“恢复出厂”（软件自带的）。删掉的出厂样式可以“＋ 新样式 › 从出厂样式添加”拿回来。改乱了不怕。</li>
    <li><b>用在哪算全</b>：图层 + 说明文字；兜底样式单独标出，不能删，但可以把别的样式设成兜底。没人用的样式排在“没在用”下面，可以一键清理。</li>
    <li><b>删除有人用的样式</b>：不是按钮变灰，而是让你选一个替代样式，一次把引用换掉再删。</li>
    <li><b>改名</b>：名字就是 ASS 样式名，可以用中文（不能有逗号；要拿常用播放器验证一下），改名时引用一起改。</li>
    <li>说明文字的样式在字幕文件的“排版”里可以选；补上阴影；底色框、字间距要改内核。</li>
  </ul>
  <p><b>内核要改的</b>：项目里写了样式，就以项目那一整套为准，不再自动补回内置样式；兜底样式可以指定。旧项目打开时把当时合并出来的完整样式写回 project.toml（一次性迁移），和“模板是复制、不实时继承”是同一个方向。</p>

  <h2>七、改的顺序（建议）</h2>
  <ol>
    <li><b>输出页</b>：把图层样式页和流程页的输出视频合并，样式有自己的清单（痛点最大，基本只动前端；删除内置样式、兜底样式要一起改内核的样式合并）。</li>
    <li><b>处理页</b>：步骤列表 + 详情，替换步骤图 + 配置卡片；运行条挪到一集页头；自动保存。</li>
    <li><b>资料页</b>：节目说明只留一处，术语、读音标范围。</li>
    <li><b>模板</b>：预设可以自建；全局配置里的处理参数迁移成“我的默认”预设；逐项比较 / 逐项恢复 / 同步给已有的集（内核要加接口，现在的覆盖是整份的）。</li>
    <li><b>库 + 作品页</b>：按作品分组；作品默认设置挪到作品页。</li>
  </ol>
  </div>`;
}

    <div class="hint" style="margin-bottom:10px">逐项决定用哪边的。被改掉的那份会先备份。所属作品、外挂字幕文件这类只属于这一集的项不列出。不属于作品的项目，模板就是建项目时选的预设，这里一样能用。</div>

    ${note("代替原来的“用作品设置覆盖这一集 / 用这一集的设置覆盖作品”两个整份覆盖按钮：先看清差在哪，再逐项或整份决定。")}

function delStyleDialog() {
  const k = S.delStyle, st = STYLES[k], used = usedBy(k);
  return h`<div class="modal" data-close="bg"><div class="card" style="width:560px">
    <h3>删除样式「${st.label}」</h3>

      <div class="usedby" style="margin-bottom:10px">${used.map((u) => `<div>${u}</div>`).join("")}</div>
      <div class="kv"><span class="lbl">改用</span><select class="inp" id="repl">${Object.entries(STYLES).filter(([x]) => x !== k).map(([x, s]) => `<option value="${x}">${s.label}</option>`).join("")}</select></div>`

    <div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" data-close="1">取消</button><button class="btn pri" data-delconfirm="1">${used.length ? "替换并删除" : "删除"}</button></div>
    ${note("有地方在用时不是让删除按钮变灰，而是让你选一个替代样式，一次把引用都换掉再删。")}

}

// ---------------- 渲染和事件 ----------------
function render() {
  const m = document.getElementById("main");
  m.innerHTML = S.view === "doc" ? doc() : S.view === "library" ? library() : S.view === "series" ? seriesPage()
    : S.view === "queue" ? queue() : S.view === "settings" ? settings() : episode();
  document.getElementById("modal").innerHTML = S.diff ? diffDialog() : S.sync ? syncDialog() : S.savePreset ? savePresetDialog() : S.delStyle ? delStyleDialog() : "";
  renderNav();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-tab],[data-step],[data-out],[data-layer],[data-fout],[data-auto],[data-runmenu],[data-diff],[data-close],[data-stab],[data-tpl],[data-scope],[data-ntab],[data-newmenu],[data-addfactory],[data-copystyle],[data-delstyle],[data-delconfirm],[data-setfb],[data-cleanstyles],[data-sync],[data-savepreset],[data-editpreset]");
  if (!t) { if ((S.runMenu || S.newMenu) && !e.target.closest(".menu")) { S.runMenu = false; S.newMenu = false; render(); } return; }
  const d = t.dataset;
  if (d.close === "bg" && e.target !== t) return;  // 点在对话框里面：不关、不重画
  if (!d.newmenu) S.newMenu = false;
  if (d.delconfirm) {
    const k = S.delStyle, r = document.getElementById("repl")?.value;
    if (r) FILES.forEach((f) => { f.layers.forEach((l) => { if (l.style === k) l.style = r; }); if (f.info === k) f.info = r; });
    delete STYLES[k];
    S.out = "s:" + (r || S.fallback);
    S.delStyle = null;
  }
  if (d.close && (d.close !== "bg" || e.target === t)) { S.diff = false; S.sync = false; S.savePreset = false; S.delStyle = null; }
  if (d.newmenu) S.newMenu = !S.newMenu;
  if (d.addfactory) { STYLES[d.addfactory] = { ...FACTORY[d.addfactory], base: d.addfactory }; S.out = "s:" + d.addfactory; }
  if (d.copystyle) {
    const src = S.out.startsWith("s:") ? S.out.slice(2) : S.fallback;
    let n = 2; while (STYLES[src + "_" + n]) n++;
    STYLES[src + "_" + n] = { ...STYLES[src], label: STYLES[src].label + " 副本", mod: "" };
    S.out = "s:" + src + "_" + n;
  }
  if (d.delstyle) S.delStyle = d.delstyle;
  if (d.setfb) S.fallback = d.setfb;
  if (d.cleanstyles) Object.keys(STYLES).forEach((k) => { if (!usedBy(k).length && k !== S.fallback) delete STYLES[k]; });
  if (d.sync) S.sync = true;
  if (d.savepreset) S.savePreset = true;
  if (d.go) {
    const [v, tab] = d.go.split(":");
    S.view = v; S.tpl = false; S.diff = false;
    if (tab) S.tab = tab;
    document.getElementById("main").scrollTop = 0;
  }
  if (d.tab) { S.tab = d.tab; document.getElementById("main").scrollTop = 0; }
  if (d.step) { const st = STEPS.find((x) => x.id === d.step); if (st?.jump && !e.target.closest(".sw")) { S.step = d.step; } else S.step = d.step; }
  if (d.fout) { e.stopPropagation(); const f = FILES.find((x) => x.id === d.fout); f.out = !f.out; }
  else if (d.out) { S.out = d.out; S.layer = d.out === "f:learn" ? 0 : d.out.startsWith("f:") ? Math.min(S.layer, (FILES.find((f) => "f:" + f.id === d.out)?.layers.length ?? 1) - 1) : S.layer; }
  if (d.layer) S.layer = Number(d.layer);
  if (d.auto) S.auto = S.auto === d.auto ? "" : d.auto;
  if (d.runmenu) S.runMenu = !S.runMenu;
  if (d.diff) S.diff = true;
  if (d.stab) S.seriesTab = d.stab;
  if (d.tpl) { S.tpl = d.tpl === "1"; S.tplOf = "series"; S.view = "series"; S.tab = "process"; }
  if (d.editpreset) { S.tpl = true; S.tplOf = "preset"; S.view = "series"; S.tab = "process"; }
  if (d.scope) S.termScope = d.scope;
  if (d.ntab) S.noteTab = d.ntab;
  render();
});
