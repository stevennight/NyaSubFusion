# NyaSubFusion 配置示例。没写的项用内置默认值。
# 配置按层合并：内置默认 < 用户全局（%APPDATA%\NyaSubFusion\config.toml）< 作品 series.toml
#             < 项目（<视频名>.nyasub\project.toml）< --config 指定的文件 < 命令行参数

[project]
source = "auto"               # 源语言：ja / zh-Hans / en / ko …；auto = 按语音或字幕自动判断
targets = ["zh-Hans"]         # 目标语言，可多个，例如 ["zh-Hans", "en"]
series = ""                   # 所属作品：多集共享节目说明、术语表（存在 %APPDATA%\NyaSubFusion\series\<作品名>\）
context = ""                  # 节目说明，会告诉大模型，例如“北海道渔村纪录片，大量老渔民方言采访”

[subs]
enabled = true
path = ""                     # 指定字幕文件；空 = 自动找同名字幕 / 内封字幕
ruby_size_ratio = 0.7         # 字号小于正文 70% 的行视为振假名小字，丢弃

[asr]
enabled = true
model = "large-v3"            # large-v3-turbo（快 3 倍，动画实测更好）/ kotoba-tech/kotoba-whisper-v2.0-faster / medium / small，
                              # 也可以写本地模型目录；Hugging Face 连不上时自动改从 ModelScope 下载
device = "cuda"
vad_threshold = 0.25          # 人声检测门槛，调低能识别小声说话
separate = "auto"             # 人声分离（先去掉背景音乐再识别）：auto = 没有字幕时才做 / on / off
hf_endpoint = ""              # 模型下载慢可用镜像：https://hf-mirror.com
backend = "local"             # local：本机 faster-whisper / api：云端接口（按时长付费，一小时约 0.3~0.4 美元）
api_kind = "transcribe"       # transcribe：/v1/audio/transcriptions / gemini：能听音频的多模态大模型（chat/completions）
api_provider = ""             # [llm] 接口列表里的名字；空 = 和翻译用同一个
api_model = "gpt-transcribe"  # whisper-1 / gemini-2.5-flash …；空 = 按 api_kind 的默认

[ocr]
enabled = true
fps = 3.0                     # 每秒检查几帧；画面字一般停留 1.5 秒以上，3 足够
refine = "none"               # vlm：视觉大模型逐条复核（更准，需要 [llm] vision_model）
# 识别区（相对比例 x0, y0, x1, y1）；可以多个，exclude = true 表示排除区（台标、角标）
regions = [
    { rect = [0.0, 0.0, 1.0, 1.0] },
    { rect = [0.82, 0.0, 1.0, 0.12], exclude = true, name = "台标" },
]

[llm]
mode = "auto"                 # auto：配了接口和 Key 就调接口，否则导出任务文件；api / export / off
# 推荐：在界面的「设置」里管理接口列表，API Key 存进系统凭据库（不写进任何配置文件）。
# 对应的配置写法（用户全局配置）：
#   translate = "deepseek"    # 翻译用哪个
#   vision = "bailian"        # 视觉复核用哪个（空 = 和翻译一样）
#   providers = [
#     { name = "deepseek", base_url = "https://api.deepseek.com/v1", model = "deepseek-chat" },
#     { name = "bailian", base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1", model = "qwen-max", vision_model = "qwen-vl-max" },
#   ]
# 下面是旧的单接口写法，没设置 translate 时使用：
# 任何 OpenAI 兼容接口都行：
#   DeepSeek    base_url = "https://api.deepseek.com/v1"   model = "deepseek-chat"
#   阿里百炼    base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"  model = "qwen-max"  vision_model = "qwen-vl-max"
#   本地 Ollama base_url = "http://127.0.0.1:11434/v1"     model = "qwen2.5:14b"
base_url = "https://api.openai.com/v1"
api_key = ""                  # 也可以不写在这里，改用环境变量（api_key_env 指定的名字，默认 OPENAI_API_KEY）
model = ""
chunk_seconds = 150           # 每段送给大模型的时长

# ---------------- 输出 ----------------
# 按语言的排版选项
[render.lang_options.zh-Hans]
line_chars = 16               # 每行字数
comma_to_space = true         # 句中逗号、句号换成空格

# 样式：按名字引用
[render.styles.main]
font = "Microsoft YaHei"
size = 60
color = "#FFFFFF"
outline_color = "#101010"
outline = 3

[render.styles.sub]
font = "Yu Gothic"
size = 38
color = "#E8E8E8"
outline = 2.4

[render.styles.info]          # 说明 / 人名条 / 地名
size = 42
color = "#FFE680"
outline = 2.4

# 输出方案：写了 [[render.profiles]] 就会替换掉内置方案。图层按画面中从上到下的顺序排列。
[[render.profiles]]
name = "bilingual"
format = "ass"
filename = "{stem}.{tr}.{ext}"   # 可用 {stem} {tr} {src} {ext} {name}
info_mode = "near"               # 说明类：near 贴原文旁 / top 顶部 / off 不显示
layers = [
    { role = "translation", style = "main" },
    { role = "original", show = "auto", style = "sub" },   # auto：画面上已有原文硬字幕时不重复显示
]

[[render.profiles]]
name = "zh-en"
format = "ass"
filename = "{stem}.zh-en.{ext}"
layers = [
    { role = "translation", lang = "zh-Hans", style = "main" },
    { role = "translation", lang = "en", style = "sub" },
]

[[render.profiles]]
name = "translation"
format = "srt"
info_mode = "top"
layers = [{ role = "translation", style = "main" }]

# ---------------- 输出视频 ----------------
[render.video]
mode = "off"                  # 运行完自动：off 不输出 / mux 封装 MKV（<名>.sub.mkv）/ burn 压制硬字幕（<名>.hardsub.mp4）
profiles = []                 # 用哪些方案；空：封装 = 所有启用的方案，压制 = 第一个启用的 ASS 方案
keep_subs = true              # 封装：保留原视频里的字幕轨
fonts = "subset"              # 封装时嵌入字体：subset 只含用到的字 / full 完整字体 / none 不嵌入
encoder = "auto"              # 压制：auto（先试 NVIDIA 显卡）/ h264_nvenc / libx264 / hevc_nvenc / libx265
quality = 20                  # 压制画质（CRF / CQ）：越小越清晰，常用 18~23
height = 0                    # 压制时缩放到这个高度；0 = 原尺寸

# ---------------- 注音与转写 ----------------
# annotate 写在图层上，能用哪种由这一层的语言决定：日语 furigana；中文 pinyin / zhuyin。
#   scope：all 全部 / difficult 只注难读（含小学低年级以外汉字的词 + 专有名词）/ proper 只注专有名词 / first 每个词首次出现
#   script（振假名）：hiragana / katakana / romaji；tone（拼音）：mark / number / none
#   size：注音字号 = 底字 × size；srt：SRT 里写成 漢字(かんじ)（paren）或不输出（none）
# transliteration 图层是整行转写：日语 → 罗马字，中文 → 整行拼音；of 指定转写哪一层（original 或目标语言代码）。
# 读音不对时写进读音词典（优先级：读音词典 > 术语表读音 > 分词器）：
#   %APPDATA%\NyaSubFusion\readings.json 或 作品目录\readings.json
#   {"entries": [{"lang": "ja", "src": "日本海", "reading": "にほんかい"}, {"lang": "zh-Hans", "src": "长发", "reading": "cháng fà"}]}

[[render.profiles]]
name = "ja-learn"
filename = "{stem}.ja-learn.{ext}"
layers = [
    { role = "original", style = "orig_main", annotate = { kind = "furigana", scope = "all" } },
    { role = "transliteration", of = "original", style = "translit" },
    { role = "translation", style = "sub" },
]

[[render.profiles]]
name = "zh-pinyin"
filename = "{stem}.zh-pinyin.{ext}"
layers = [
    { role = "translation", style = "main", annotate = { kind = "pinyin", tone = "mark", size = 0.45 } },
    { role = "original", show = "auto", style = "sub", annotate = { kind = "furigana", scope = "difficult" } },
]
