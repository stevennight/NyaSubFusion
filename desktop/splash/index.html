<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NyaSubFusion</title>
<style>
  html, body { margin: 0; height: 100%; background: #141419; color: #e9e9f0; font: 14px/1.6 "Segoe UI", "Microsoft YaHei UI", sans-serif }
  body { display: grid; place-items: center }
  .box { text-align: center }
  .logo { font-size: 22px; font-weight: 700; margin: 14px 0 6px } .logo b { color: #ff7aa8 }
  .msg { color: #a9a9b8 }
  .err { color: #ffb3b3; max-width: 640px; margin-top: 10px; white-space: pre-wrap; word-break: break-all }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #b49cff; margin: 0 3px; animation: p 1.2s infinite }
  .dot:nth-child(2) { animation-delay: .2s } .dot:nth-child(3) { animation-delay: .4s }
  @keyframes p { 50% { opacity: .2 } }
  /* 没有系统标题栏：顶上一条可拖动，右上角最小化 / 关闭（内核起不来时也能关掉） */
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 48px; display: flex; justify-content: flex-end }
  .bar button { width: 46px; border: 0; background: none; color: #a9a9b8; display: grid; place-items: center; padding: 0 }
  .bar button:hover { background: #272733; color: #e9e9f0 } .bar button.x:hover { background: #e81123; color: #fff }
  .bar svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1; shape-rendering: crispEdges }
</style>
</head>
<body>
<div class="bar" data-tauri-drag-region>
  <button onclick="win() && win().minimize()" title="最小化"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
  <button class="x" onclick="win() && win().close()" title="关闭"><svg viewBox="0 0 10 10"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"/></svg></button>
</div>
<div class="box">
  <img src="icon.png" width="76" height="76" alt="NyaSubFusion" style="display:block;margin:0 auto">
  <div class="logo">Nya<b>Sub</b>Fusion</div>
  <div class="msg" id="msg">正在启动内核 <span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="err" id="err"></div>
</div>
<script>
  const win = () => window.__TAURI__ && window.__TAURI__.window.getCurrentWindow();
  window.showError = (m) => {
    document.getElementById("msg").textContent = "启动失败";
    document.getElementById("err").textContent = m;
  };
</script>
</body>
</html>
