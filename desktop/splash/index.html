<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NyaSubFusion</title>
<style>
  html, body { margin: 0; height: 100%; background: #141419; color: #e9e9f0; font: 14px/1.6 "Segoe UI", "Microsoft YaHei UI", sans-serif }
  body { display: grid; place-items: center }
  .box { text-align: center }
  .logo { font-size: 22px; font-weight: 700; margin: 14px 0 6px } .logo b { color: #ff7aa8 }
  .msg { color: #a9a9b8 }
  .err { color: #ffb3b3; max-width: 640px; margin-top: 10px; white-space: pre-wrap; word-break: break-all }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #b49cff; margin: 0 3px; animation: p 1.2s infinite }
  .dot:nth-child(2) { animation-delay: .2s } .dot:nth-child(3) { animation-delay: .4s }
  @keyframes p { 50% { opacity: .2 } }
</style>
</head>
<body>
<div class="box">
  <svg width="64" height="64" viewBox="0 0 32 32"><path d="M5 8 L9 3 L13 9 Q16 8 19 9 L23 3 L27 8 Q29 13 28 19 Q26 28 16 28 Q6 28 4 19 Q3 13 5 8Z" fill="#ff7aa8"/><circle cx="11.5" cy="16" r="2" fill="#2a0d18"/><circle cx="20.5" cy="16" r="2" fill="#2a0d18"/><path d="M14 21 Q16 23 18 21" stroke="#2a0d18" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="7" y="23.5" width="18" height="2.2" rx="1.1" fill="#fff" opacity=".85"/></svg>
  <div class="logo">Nya<b>Sub</b>Fusion</div>
  <div class="msg" id="msg">正在启动内核 <span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="err" id="err"></div>
</div>
<script>
  window.showError = (m) => {
    document.getElementById("msg").textContent = "启动失败";
    document.getElementById("err").textContent = m;
  };
</script>
</body>
</html>
