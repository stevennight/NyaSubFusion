[project]
name = "nyasub"
version = "0.6.7"
description = "通用、可视化、可配置的多源字幕生成与翻译工具（内核）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pysubs2>=1.7",
    "rapidfuzz>=3.0",
    "numpy>=1.26",
    "openai>=1.40",
    "tomli-w>=1.0",
    "keyring>=24",
]

[project.optional-dependencies]
# 语音识别（av<19：faster-whisper 1.2.x 调用 av.open(..., metadata_errors="ignore")，PyAV 19+ 移除了该参数）
asr = ["faster-whisper>=1.1", "av<19"]
# 画面字识别
ocr = ["rapidocr>=3.0", "opencv-python-headless>=4.8"]
# 注音与转写：日语分词（振假名、罗马字、断行）、中文拼音、中文分词（断行不拆开词）、字体度量（ASS 注音定位）
lang = ["sudachipy>=0.6", "sudachidict-core", "pypinyin>=0.50", "jieba>=0.42", "fonttools>=4.40"]
# 本地服务（界面通过它调内核）
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# GPU 推理（Windows / Linux 用 onnxruntime-gpu；macOS 用原生 onnxruntime 自带 CoreML）
gpu = [
    "onnxruntime-gpu[cuda,cudnn]>=1.20; sys_platform != 'darwin'",
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
]
# Apple Silicon 语音识别 GPU 加速（可选）
mlx = [
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
nyasub = "nyasub.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
packaging = ["pyinstaller>=6"]

[tool.uv]
# Windows / Linux：faster-whisper 依赖 CPU 版 onnxruntime，和 onnxruntime-gpu 同名冲突；macOS 没有 onnxruntime-gpu，保留原生 onnxruntime（自带 CoreML）
override-dependencies = ["onnxruntime; sys_platform == 'darwin'"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 需要 ffmpeg / 识别模型的端到端测试",
]

[tool.ruff]
line-length = 120
target-version = "py311"
